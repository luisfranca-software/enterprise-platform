[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-platform-backend"
version = "0.1.0"
description = "Enterprise Platform — Django backend foundation"
requires-python = ">=3.13"

[tool.setuptools.packages.find]
where = ["."]

[project.urls]
Homepage = "https://github.com/anomalyco/enterprise-platform"
